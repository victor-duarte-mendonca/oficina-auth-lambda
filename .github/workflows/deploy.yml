name: Deploy

# E5/E6 (specs 02 e 03): package -> plan (PR) -> apply por branch (homolog -> hml, main -> prod) -> smoke tests
# (função e gateway). destroy manual com confirmação. Os checks obrigatórios (build-test, terraform-check)
# ficam em ci.yml.
#
# hml sobe SOB DEMANDA (spec 06 §4.1): num push, se a infraestrutura (oficina-infra-k8s e
# oficina-infra-database) ou a sessão AWS não estiverem de pé, o apply é ignorado com um aviso — o merge
# não fica vermelho. Dispare à mão depois de subir a infra e de implantar a aplicação:
# Actions > Deploy > Run workflow > Use workflow from: homolog (o smoke test pelo gateway exige a app).
on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      workspace:
        description: "Workspace a destruir (somente para o destroy; omita para um apply manual)"
        type: choice
        options: [hml, prod]
        required: false
      confirm:
        description: 'Para destruir, digite "destroy-<workspace>" (ex.: destroy-hml)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  package:
    name: package
    if: inputs.confirm == '' || inputs.confirm == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Os testes já rodam no build-test (ci.yml); aqui só se empacotam os dois ZIPs.
      - run: mvn -B -DskipTests package
      - name: Checksums dos artefatos
        run: sha256sum auth-function/target/auth-function.jar authorizer-function/target/authorizer-function.jar | tee jars.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: |
            auth-function/target/auth-function.jar
            authorizer-function/target/authorizer-function.jar
            jars.sha256
          if-no-files-found: error

  # A infraestrutura (VPC, RDS, k3s) existe? Sem ela o plan/apply só falharia com ParameterNotFound.
  stack:
    name: stack
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.confirm == '' || inputs.confirm == null))
    runs-on: ubuntu-latest
    env:
      STACK_ENV: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      # Credenciais via ambiente: a action configure-aws-credentials valida o token na entrada e falharia
      # antes de eu poder tratar "sessão expirada" como "stack fora do ar".
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    outputs:
      up: ${{ steps.check.outputs.up }}
    steps:
      - name: Infraestrutura publicada no SSM?
        id: check
        run: |
          set +e
          missing=""
          for name in vpc_id private_subnet_ids rds_security_group_id db_endpoint k3s_eip; do
            out="$(aws ssm get-parameter --name "/oficina/${STACK_ENV}/${name}" --query Parameter.Value --output text 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if echo "$out" | grep -q "ParameterNotFound"; then
                missing="$missing $name"
                continue
              fi
              if echo "$out" | grep -Eq "ExpiredToken|InvalidClientTokenId|UnrecognizedClient|security token|Unable to locate credentials"; then
                reason="sessão AWS Academy inativa ou credenciais expiradas: rode set-aws-session-secrets.sh"
              else
                echo "::error::Falha inesperada ao consultar o SSM:"
                echo "$out"
                exit 1
              fi
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::Apply manual impossível: ${reason}"
                exit 1
              fi
              echo "::notice::Apply ignorado: ${reason}."
              echo "up=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          set -e

          if [ -z "$missing" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason="faltam parâmetros em /oficina/${STACK_ENV}/ ($missing): aplique oficina-infra-k8s e oficina-infra-database neste workspace"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Apply manual impossível: ${reason}"
            exit 1
          fi
          echo "::notice::Apply ignorado: ${reason}. Depois de subir a infra, dispare o workflow manualmente."
          echo "up=false" >> "$GITHUB_OUTPUT"

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: [package]
    runs-on: ubuntu-latest
    env:
      # PR para homolog ensaia em hml; PR para main (promoção) planeja prod.
      WORKSPACE: ${{ github.base_ref == 'main' && 'prod' || 'hml' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # Os segredos reais são de *environment*; usá-los no plan pediria a aprovação de producao a cada PR
      # para main. Valores placeholder só satisfazem a validação das variáveis: o plan mostra as
      # variáveis de ambiente dos Lambdas e a chave do gateway como alteradas (ruído esperado, ignorar).
      TF_VAR_db_password: plan-only-placeholder-not-a-real-password
      TF_VAR_gateway_key: plan-only-placeholder-gateway-key
    steps:
      - uses: actions/checkout@v4
      - name: Sessão AWS ativa?
        id: creds
        run: |
          if aws sts get-caller-identity > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem sessão AWS ativa (credenciais ausentes ou expiradas); terraform plan não executado. Rode set-aws-session-secrets.sh."
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.present == 'true'
        with:
          name: lambda-package
          path: .
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        if: steps.creds.outputs.present == 'true'
        working-directory: terraform
        run: |
          # O data tls_public_key interpreta a chave já no plan: um placeholder de texto não é PEM. Gera uma
          # chave descartável só para o plan (a real é secret de environment e pediria aprovação em todo PR).
          TF_VAR_jwt_private_key_pem="$(openssl genrsa 2048 2>/dev/null | openssl pkcs8 -topk8 -nocrypt)"
          export TF_VAR_jwt_private_key_pem
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform plan -input=false -no-color -out=tfplan \
            -var="package_path=${GITHUB_WORKSPACE}/auth-function/target/auth-function.jar" \
            -var="authorizer_package_path=${GITHUB_WORKSPACE}/authorizer-function/target/authorizer-function.jar"
          terraform show -no-color tfplan > plan.txt
      - name: Comentar plano no PR
        if: steps.creds.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (plano truncado)';
            const body = `### terraform plan — workspace \`${process.env.WORKSPACE}\`\n\n<details><summary>Plano</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  apply:
    name: apply
    needs: [package, stack]
    if: needs.stack.outputs.up == 'true'
    runs-on: ubuntu-latest
    # homolog -> hml / homologacao ; main -> prod / producao (required reviewer).
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_db_password: ${{ secrets.LAMBDA_RO_PASSWORD }}
      TF_VAR_jwt_private_key_pem: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
      TF_VAR_gateway_key: ${{ secrets.APP_GATEWAY_KEY }}
    concurrency:
      group: terraform-state-${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      cancel-in-progress: false
    steps:
      - name: Secrets do environment definidos?
        run: |
          missing=""
          [ -n "$TF_VAR_db_password" ] || missing="$missing LAMBDA_RO_PASSWORD"
          [ -n "$TF_VAR_jwt_private_key_pem" ] || missing="$missing JWT_PRIVATE_KEY_PEM"
          [ -n "$TF_VAR_gateway_key" ] || missing="$missing APP_GATEWAY_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes no environment (Settings > Environments):$missing. LAMBDA_RO_PASSWORD = senha do papel oficina_auth_ro; JWT_PRIVATE_KEY_PEM = a mesma chave privada da aplicação; APP_GATEWAY_KEY = o mesmo valor da aplicação (X-Gateway-Key)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # `publish = true` publica a versão (SnapStart) e o alias `live` passa a apontar para ela.
      - name: terraform apply
        working-directory: terraform
        run: |
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform apply -input=false -auto-approve -no-color \
            -var="package_path=${GITHUB_WORKSPACE}/auth-function/target/auth-function.jar" \
            -var="authorizer_package_path=${GITHUB_WORKSPACE}/authorizer-function/target/authorizer-function.jar"
      - name: Smoke test da função (invoca o alias)
        working-directory: terraform
        run: |
          bash ../scripts/smoke-test.sh "$(terraform output -raw function_name)" "$(terraform output -raw alias_name)"
      # Exige a aplicação implantada neste workspace (o gateway roteia para ela e o papel oficina_auth_ro só
      # existe depois de ela migrar o banco).
      - name: Smoke test pelo gateway (ponta a ponta)
        working-directory: terraform
        env:
          ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
        run: |
          API_URL="$(terraform output -raw api_endpoint)" \
          GATEWAY_LOG_GROUP="$(terraform output -raw gateway_log_group_name)" \
            bash ../scripts/smoke-gateway.sh
      - name: Resumo
        working-directory: terraform
        run: |
          {
            echo "### apply concluído — workspace \`$WORKSPACE\`"
            echo ""
            echo "- Função: \`$(terraform output -raw function_name):$(terraform output -raw alias_name)\`"
            echo "- Authorizer: \`$(terraform output -raw authorizer_function_name)\`"
            echo "- **API Gateway: $(terraform output -raw api_endpoint)**"
            echo "- Custo: Lambda + SnapStart e HTTP API ≈ US\$ 0 (nível gratuito); sem NAT Gateway."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch' && inputs.confirm != '' && inputs.confirm != null
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace == 'prod' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ inputs.workspace }}
      CONFIRM: ${{ inputs.confirm }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # O destroy exige as variáveis obrigatórias, mas não as usa: placeholders evitam depender dos segredos.
      TF_VAR_db_password: destroy-only-placeholder-not-used
      TF_VAR_jwt_private_key_pem: destroy-only-placeholder
      TF_VAR_gateway_key: destroy-only-placeholder-not-used
    concurrency:
      group: terraform-state-${{ inputs.workspace }}
      cancel-in-progress: false
    steps:
      - name: Confirmação digitada
        run: |
          if [ "$CONFIRM" != "destroy-${WORKSPACE}" ]; then
            echo "::error::Confirmação incorreta. Esperado: destroy-${WORKSPACE}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # package_path aponta para um arquivo qualquer existente: filebase64sha256 precisa lê-lo, mas o
      # destroy não envia código.
      - name: terraform destroy
        working-directory: terraform
        run: |
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select "$WORKSPACE"
          terraform destroy -input=false -auto-approve -no-color \
            -var="package_path=${GITHUB_WORKSPACE}/README.md" \
            -var="authorizer_package_path=${GITHUB_WORKSPACE}/README.md"
      - name: Varredura de restos por tag
        run: |
          LEFT=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=Project,Values=oficina" "Key=Environment,Values=${WORKSPACE}" \
            --resource-type-filters lambda ec2:security-group logs apigateway \
            --query 'ResourceTagMappingList[].ResourceARN' --output text)
          if [ -n "$LEFT" ]; then
            echo "::warning::Recursos ainda com a tag (a API de tags pode atrasar alguns minutos; o SG do k3s é do infra-k8s e é esperado)."
            echo "$LEFT" | tr '\t' '\n'
          else
            echo "Nenhum resto de Lambda/SG/logs/API com Project=oficina, Environment=${WORKSPACE}."
          fi
