name: Deploy

# E5 (spec 02 §9): package -> plan (PR) -> apply por branch (homolog -> hml, main -> prod) -> smoke test.
# destroy manual com confirmação. Os checks obrigatórios (build-test, terraform-check) ficam em ci.yml.
on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      workspace:
        description: "Workspace a destruir"
        type: choice
        options: [hml, prod]
        required: true
      confirm:
        description: 'Digite "destroy-<workspace>" para confirmar (ex.: destroy-hml)'
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  package:
    name: package
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Os testes já rodam no build-test (ci.yml); aqui só se empacota o ZIP do Lambda.
      - run: mvn -B -DskipTests package
      - name: Checksum do artefato
        run: sha256sum auth-function/target/auth-function.jar | tee auth-function.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: |
            auth-function/target/auth-function.jar
            auth-function.jar.sha256
          if-no-files-found: error

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: [package]
    runs-on: ubuntu-latest
    env:
      # PR para homolog ensaia em hml; PR para main (promoção) planeja prod.
      WORKSPACE: ${{ github.base_ref == 'main' && 'prod' || 'hml' }}
      # Os segredos reais são de *environment*; usá-los no plan pediria a aprovação de producao a cada PR
      # para main. Valores placeholder só satisfazem a validação das variáveis: o plan mostra as
      # variáveis de ambiente do Lambda como alteradas (ruído esperado, ignorar).
      TF_VAR_db_password: plan-only-placeholder-not-a-real-password
      TF_VAR_jwt_private_key_pem: plan-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Credenciais da sessão presentes?
        id: creds
        run: echo "present=${{ secrets.AWS_ACCESS_KEY_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Sem credenciais — plan não executado
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::AWS_ACCESS_KEY_ID ausente; terraform plan requer as credenciais STS da sessão AWS Academy."
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.present == 'true'
        with:
          name: lambda-package
          path: .
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.present == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        if: steps.creds.outputs.present == 'true'
        working-directory: terraform
        run: |
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform plan -input=false -no-color -out=tfplan -var="package_path=${GITHUB_WORKSPACE}/auth-function/target/auth-function.jar"
          terraform show -no-color tfplan > plan.txt
      - name: Comentar plano no PR
        if: steps.creds.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const max = 60000;
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (plano truncado)';
            const body = `### terraform plan — workspace \`${process.env.WORKSPACE}\`\n\n<details><summary>Plano</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  apply:
    name: apply
    if: github.event_name == 'push'
    needs: [package]
    runs-on: ubuntu-latest
    # homolog -> hml / homologacao ; main -> prod / producao (required reviewer).
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      TF_VAR_db_password: ${{ secrets.LAMBDA_RO_PASSWORD }}
      TF_VAR_jwt_private_key_pem: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
    concurrency:
      group: terraform-state-${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      cancel-in-progress: false
    steps:
      - name: Secrets do environment definidos?
        run: |
          missing=""
          [ -n "$TF_VAR_db_password" ] || missing="$missing LAMBDA_RO_PASSWORD"
          [ -n "$TF_VAR_jwt_private_key_pem" ] || missing="$missing JWT_PRIVATE_KEY_PEM"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes no environment (Settings > Environments):$missing. LAMBDA_RO_PASSWORD = senha do papel oficina_auth_ro; JWT_PRIVATE_KEY_PEM = a mesma chave privada da aplicação."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # `publish = true` publica a versão (SnapStart) e o alias `live` passa a apontar para ela.
      - name: terraform apply
        working-directory: terraform
        run: |
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select -or-create "$WORKSPACE"
          terraform apply -input=false -auto-approve -no-color -var="package_path=${GITHUB_WORKSPACE}/auth-function/target/auth-function.jar"
      - name: Smoke test (invoca o alias)
        working-directory: terraform
        run: |
          bash ../scripts/smoke-test.sh "$(terraform output -raw function_name)" "$(terraform output -raw alias_name)"
      - name: Resumo
        working-directory: terraform
        run: |
          {
            echo "### apply concluído — workspace \`$WORKSPACE\`"
            echo ""
            echo "- Função: \`$(terraform output -raw function_name):$(terraform output -raw alias_name)\`"
            echo "- Custo: Lambda + SnapStart US\$ 0 (nível gratuito); sem NAT Gateway."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.workspace == 'prod' && 'producao' || 'homologacao' }}
    env:
      WORKSPACE: ${{ inputs.workspace }}
      CONFIRM: ${{ inputs.confirm }}
      # O destroy exige as variáveis obrigatórias, mas não as usa: placeholders evitam depender dos segredos.
      TF_VAR_db_password: destroy-only-placeholder-not-used
      TF_VAR_jwt_private_key_pem: destroy-only-placeholder
    concurrency:
      group: terraform-state-${{ inputs.workspace }}
      cancel-in-progress: false
    steps:
      - name: Confirmação digitada
        run: |
          if [ "$CONFIRM" != "destroy-${WORKSPACE}" ]; then
            echo "::error::Confirmação incorreta. Esperado: destroy-${WORKSPACE}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # package_path aponta para um arquivo qualquer existente: filebase64sha256 precisa lê-lo, mas o
      # destroy não envia código.
      - name: terraform destroy
        working-directory: terraform
        run: |
          BUCKET="$(bash ../scripts/bootstrap-state-bucket.sh)"
          terraform init -input=false -backend-config="bucket=${BUCKET}"
          terraform workspace select "$WORKSPACE"
          terraform destroy -input=false -auto-approve -no-color -var="package_path=${GITHUB_WORKSPACE}/README.md"
      - name: Varredura de restos por tag
        run: |
          LEFT=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=Project,Values=oficina" "Key=Environment,Values=${WORKSPACE}" \
            --resource-type-filters lambda ec2:security-group logs \
            --query 'ResourceTagMappingList[].ResourceARN' --output text)
          if [ -n "$LEFT" ]; then
            echo "::warning::Recursos ainda com a tag (a API de tags pode atrasar alguns minutos; o SG do k3s é do infra-k8s e é esperado)."
            echo "$LEFT" | tr '\t' '\n'
          else
            echo "Nenhum resto de Lambda/SG/logs com Project=oficina, Environment=${WORKSPACE}."
          fi
